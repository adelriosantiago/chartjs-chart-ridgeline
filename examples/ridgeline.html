<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chart.js Ridgeline example</title>
</head>
<body>
  <canvas id="ridgeline"></canvas>
  <script src="../node_modules/chart.js/dist/chart.umd.min.js"></script>
  <script src="../dist/chartjs-chart-ridgeline.umd.js"></script>
  <script>
    Chart.register(RidgelinePlugin.RidgelineController);
    const data = {
      labels: ['Group A', 'Group B', 'Group C'],
      datasets: [{
        label: 'Distribution',
        data: [
          [12, 15, 18, 22, 25, 30, 32],
          [18, 20, 23, 24, 29, 35, 38],
          [10, 12, 15, 17, 19, 21, 24]
        ],
        backgroundColor: ['rgba(54, 162, 235, .55)', 'rgba(255, 99, 132, .55)', 'rgba(255, 206, 86, .6)'],
        borderColor: ['rgb(54, 162, 235)', 'rgb(255, 99, 132)', 'rgb(220, 165, 35)']
      }]
    };

    new Chart(document.getElementById('ridgeline'), {
      type: 'ridgeline',
      data,
      options: {responsive: true, overlap: 0.45, spacing: 0.18, amplitude: 0.9}
    });
  </script>
</body>
</html>
